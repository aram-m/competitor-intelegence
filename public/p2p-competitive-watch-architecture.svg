<svg width="1600" height="1400" viewBox="0 0 1600 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="1400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <linearGradient id="panel" x1="230" y1="0" x2="1370" y2="1400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121A2B"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B59FF"/>
      <stop offset="1" stop-color="#5D7CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6F86C8"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px Inter, Arial, sans-serif; fill: #88A0FF; letter-spacing: 0.24em; text-transform: uppercase; }
      .hero { font: 700 42px Inter, Arial, sans-serif; fill: #F8FBFF; }
      .sub { font: 500 22px Inter, Arial, sans-serif; fill: #A9B5D3; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #88A0FF; letter-spacing: 0.2em; text-transform: uppercase; }
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #F8FBFF; }
      .body { font: 500 20px Inter, Arial, sans-serif; fill: #B9C5E4; }
      .tiny { font: 600 16px Inter, Arial, sans-serif; fill: #DCE5FF; }
    </style>
  </defs>

  <rect width="1600" height="1400" rx="40" fill="url(#bg)"/>

  <text x="110" y="92" class="eyebrow">P2P Competitive Watch</text>
  <text x="110" y="152" class="hero">Architecture Overview</text>
  <text x="110" y="194" class="sub">From external competitor signals to Firebase-backed AI briefs in the dashboard.</text>

  <text x="58" y="390" transform="rotate(-90 58 390)" class="section">Ingest</text>
  <text x="58" y="760" transform="rotate(-90 58 760)" class="section">Intelligence</text>
  <text x="58" y="1080" transform="rotate(-90 58 1080)" class="section">Experience</text>

  <g filter="url(#shadow)">
    <rect x="400" y="250" width="800" height="110" rx="28" fill="url(#panel)" stroke="#3B4B68" stroke-width="2"/>
    <text x="800" y="297" text-anchor="middle" class="title">External Sources</text>
    <text x="800" y="332" text-anchor="middle" class="body">Blogs • GitHub • Hiring Pages</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="415" width="920" height="126" rx="30" fill="url(#panel)" stroke="url(#accent)" stroke-width="3"/>
    <text x="800" y="466" text-anchor="middle" class="title">Firebase Functions</text>
    <text x="800" y="504" text-anchor="middle" class="body">scheduledCrawl / triggerCrawl</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="245" y="600" width="1110" height="136" rx="32" fill="url(#panel)" stroke="#5D7CFF" stroke-width="2.5"/>
    <text x="800" y="652" text-anchor="middle" class="title">Processing Layer</text>
    <text x="800" y="690" text-anchor="middle" class="body">Extract items • Normalize URLs • Deduplicate signals</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="150" y="815" width="540" height="170" rx="32" fill="url(#panel)" stroke="#8EA3D1" stroke-width="2.5"/>
    <text x="420" y="867" text-anchor="middle" class="title">Firestore: signals</text>
    <text x="420" y="906" text-anchor="middle" class="body">Raw evidence</text>
    <text x="420" y="938" text-anchor="middle" class="body">Metadata</text>
    <text x="420" y="970" text-anchor="middle" class="body">Source links + timestamps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="815" width="540" height="170" rx="32" fill="url(#panel)" stroke="#5D7CFF" stroke-width="2.5"/>
    <text x="1180" y="867" text-anchor="middle" class="title">Gemini Brief Layer</text>
    <text x="1180" y="906" text-anchor="middle" class="body">Summary</text>
    <text x="1180" y="938" text-anchor="middle" class="body">Why It Matters</text>
    <text x="1180" y="970" text-anchor="middle" class="body">Watch Next</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="1035" width="800" height="120" rx="30" fill="url(#panel)" stroke="#8EA3D1" stroke-width="2.5"/>
    <text x="800" y="1086" text-anchor="middle" class="title">Firestore: company_summaries</text>
    <text x="800" y="1125" text-anchor="middle" class="body">One AI brief per company</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="1215" width="920" height="126" rx="30" fill="url(#panel)" stroke="url(#accent)" stroke-width="3"/>
    <text x="800" y="1266" text-anchor="middle" class="title">Firebase Hosting + React UI</text>
    <text x="800" y="1304" text-anchor="middle" class="body">Desktop company cards • Mobile swipe deck</text>
  </g>

  <path d="M800 360V397" stroke="#6F86C8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 541V582" stroke="#6F86C8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 736V792" stroke="#6F86C8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 900H886" stroke="#6F86C8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1180 985V1014" stroke="#6F86C8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 1155V1192" stroke="#6F86C8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="114" y="1036" width="220" height="96" rx="22" fill="#0E1627" stroke="#25324B" stroke-width="1.5"/>
  <text x="224" y="1072" text-anchor="middle" class="tiny">Firebase</text>
  <text x="224" y="1101" text-anchor="middle" class="body">Functions</text>

  <rect x="1268" y="1036" width="220" height="96" rx="22" fill="#0E1627" stroke="#25324B" stroke-width="1.5"/>
  <text x="1378" y="1072" text-anchor="middle" class="tiny">Firebase</text>
  <text x="1378" y="1101" text-anchor="middle" class="body">Hosting</text>
</svg>
